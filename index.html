<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">

  <title>I GRIMALDI E.S.G.</title>

  <link rel="icon" type="image/jpeg" href="assets_logo.png">
  <link rel="apple-touch-icon" href="assets_logo.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ONESIGNAL -->
  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    window.OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "864d0967-8a2d-4fe1-8a19-e95fe866b28b",
          serviceWorkerPath: "OneSignalSDKWorker.js"
        });

        window.oneSignalReady = true;

        console.log("I GRIMALDI - OneSignal pronto");
      } catch (error) {
        window.oneSignalReady = false;

        console.error(
          "I GRIMALDI - Errore inizializzazione OneSignal:",
          error
        );
      }
    });
  </script>
</head>

<body>

<div id="loadingScreen" class="loading-screen">
  <div class="loading-mark">
    <div class="loading-kicker">E.S.G. PARRUCCHIERI</div>
    <div class="loading-logo">I GRIMALDI</div>
    <div class="loading-line"></div>
    <div class="loading-caption">10 VOLTE CAMPIONE D'ITALIA</div>
  </div>
</div>

<div id="app" class="app">

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand">I GRIMALDI</div>

      <div class="brand-divider">
        <span></span>
        <b>E.S.G.</b>
        <span></span>
      </div>

      <div class="brand-sub">PARRUCCHIERI</div>
    </div>

    <button
      class="profile-dot"
      onclick="showPage('profilePage')"
      aria-label="Profilo"
    >
      TU
    </button>
  </header>


  <main class="main-content">

    <!-- HOME -->
    <section id="homePage" class="page active">

      <div class="hero-card">

        <div
          class="text-logo-home"
          aria-label="I GRIMALDI E.S.G. PARRUCCHIERI - 10 volte campione d'Italia"
        >

          <div class="home-stars" aria-hidden="true">
            <span class="star-g">✦</span>
            <span class="star-w">✦</span>
            <span class="star-r">✦</span>
          </div>

          <div class="home-logo-title">
            I GRIMALDI
          </div>

          <div class="home-esg-row">
            <span></span>
            <b>E.S.G.</b>
            <span></span>
          </div>

          <div class="home-logo-sub">
            PARRUCCHIERI
          </div>

          <div class="home-champion">
            10 VOLTE CAMPIONE D'ITALIA
          </div>

        </div>

        <button
          class="gold-button"
          onclick="showPage('bookingPage')"
        >
          PRENOTA ORA <span>→</span>
        </button>

      </div>


      <div class="section-head">
        <span>ESPERIENZA GRIMALDI</span>
        <h2>Tutto quello che ti serve</h2>
      </div>


      <div class="home-grid">
